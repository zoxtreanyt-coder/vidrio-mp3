<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vidrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
@property --amb1{syntax:'<color>';inherits:true;initial-value:#4f5bd5}
@property --amb2{syntax:'<color>';inherits:true;initial-value:#c2468d}
:root{
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#0b0b0e; --fg:#f5f6fb; --muted:rgba(245,246,251,.64); --faint:rgba(245,246,251,.4);
  --glass-a:rgba(255,255,255,.15); --glass-b:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.17); --glass-hi:rgba(255,255,255,.3);
  --hair:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.42); --track:rgba(255,255,255,.2); --bar:rgba(255,255,255,.28);
  --accent:#f5f6fb; --on-accent:#0b0b0e; --chip-on:#f5f6fb; --chip-on-fg:#0b0b0e;
  --sheet:rgba(11,11,14,.75); --amb-mix:65%;
  color-scheme:dark;
  transition:--amb1 1.2s ease,--amb2 1.2s ease;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ececf0; --fg:#11131b; --muted:rgba(17,19,27,.64); --faint:rgba(17,19,27,.42);
  --glass-a:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,1);
  --hair:rgba(17,19,27,.08); --shadow:rgba(40,50,90,.18); --track:rgba(17,19,27,.16); --bar:rgba(17,19,27,.2);
  --accent:#15161b; --on-accent:#fff; --chip-on:#11131b; --chip-on-fg:#fff;
  --sheet:rgba(236,236,240,.82); --amb-mix:45%; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ececf0; --fg:#11131b; --muted:rgba(17,19,27,.64); --faint:rgba(17,19,27,.42);
  --glass-a:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,1);
  --hair:rgba(17,19,27,.08); --shadow:rgba(40,50,90,.18); --track:rgba(17,19,27,.16); --bar:rgba(17,19,27,.2);
  --accent:#15161b; --on-accent:#fff; --chip-on:#11131b; --chip-on-fg:#fff;
  --sheet:rgba(236,236,240,.82); --amb-mix:45%; color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%; width:100%; margin:0; padding:0; overflow:hidden; background:var(--bg); color:var(--fg); font:400 15px/1.35 var(--f-body); -webkit-tap-highlight-color:transparent;}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}

.amb{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(80% 50% at 15% -10%,color-mix(in srgb,var(--amb1) var(--amb-mix),transparent),transparent 75%),
  radial-gradient(70% 50% at 95% 35%,color-mix(in srgb,var(--amb2) calc(var(--amb-mix) - 10%),transparent),transparent 75%),
  radial-gradient(80% 50% at 5% 105%,color-mix(in srgb,var(--amb2) calc(var(--amb-mix) - 20%),transparent),transparent 75%);
  filter:blur(32px);transform:scale(1.1);
}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#views{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 210px;scrollbar-width:none;overscroll-behavior:contain}
#views::-webkit-scrollbar{display:none}

.glass{background:linear-gradient(135deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 32px -14px var(--shadow)}

.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 34px/1.02 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
h2{margin:0;font:650 20px/1.1 var(--f-display);letter-spacing:-.015em}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.hbtns{display:flex;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toprow .back{margin:0}
.sec{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.lnk{color:var(--accent);font-weight:600;font-size:14px}
.muted{color:var(--muted)}

.cv,.mos{aspect-ratio:1;border-radius:12px;background-size:cover;background-position:center;flex:none;display:grid;place-items:center;overflow:hidden;max-width:100%}
.cv.ph{background:linear-gradient(135deg,hsl(var(--h) 12% 50%),hsl(calc(var(--h) + 30) 10% 26%));color:rgba(255,255,255,.88)}
.cv.ph .i{width:38%;height:38%}
.mos{grid-template-columns:1fr 1fr;gap:2px;background:var(--hair)}
.mos i{background-size:cover;background-position:center;width:100%;height:100%}
.s44{width:44px;border-radius:10px}.s48{width:48px}.s56{width:56px}.s72{width:72px;border-radius:14px}.s138{width:138px;border-radius:16px}.sfull{width:100%}

.note{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:18px;margin-bottom:14px;font-size:13.5px;color:var(--muted)}
.note .lnk{white-space:nowrap}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qt{display:flex;align-items:center;border-radius:14px;overflow:hidden;min-width:0;height:56px}
.qt .cv{border-radius:0}
.qt span{padding:0 10px;font-weight:600;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}

.card{border-radius:24px;padding:16px;width:100%;display:block}
.big{margin:4px 0 0;font:700 34px/1.05 var(--f-display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.wk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.b em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.b i{display:block;width:100%;max-width:34px;border-radius:8px;background:var(--bar)}
.b.today i{background:var(--accent)}
.b.today em{color:var(--fg);font-weight:700}
.b span{font-size:11px;color:var(--faint);font-weight:600}
.cap{margin:10px 0 0;font-size:12px;color:var(--faint)}

.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.ct{width:138px;flex:none;scroll-snap-align:start;min-width:0}
.ct .t{display:block;font-weight:600;margin-top:8px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .a{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:16px;border-radius:18px;font-size:14px;color:var(--muted)}

.list{border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;width:100%;position:relative;min-width:0}
.row+.row::before{content:"";position:absolute;top:0;left:72px;right:0;border-top:1px solid var(--hair)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.du{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.row.on .tt{color:var(--accent)}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.row.on .eq{display:flex}
.eq i{width:3px;height:30%;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{50%{height:100%}}
.rk{width:22px;text-align:center;font:650 15px var(--f-display);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.rk.first{color:var(--accent)}
.st{text-align:right;flex:none}
.st b{display:block;font-variant-numeric:tabular-nums;font-size:14px}
.st small{color:var(--faint);font-size:12px}
.chev{color:var(--faint);width:18px;height:18px}
.row.fo .row-sub{font-size:12.5px;color:var(--faint)}

.seg{display:inline-grid;grid-auto-flow:column;padding:3px;border-radius:999px;margin-bottom:14px}
.seg button,.chip{padding:7px 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg .on,.chip.on{background:var(--chip-on);color:var(--chip-on-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border:1px solid var(--glass-line);background:linear-gradient(135deg,var(--glass-a),var(--glass-b))}
.chip.on{border-color:transparent}
.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 16px;height:46px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;outline:none}
.search input::placeholder{color:var(--faint)}
.acts{display:flex;gap:10px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:650;flex:1;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn .i{width:18px;height:18px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;margin-bottom:12px}
.back .i{width:20px;height:20px}
.fhead{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.fhead .meta h1{font-size:26px}

.dock{position:absolute;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.dock>*{pointer-events:auto}
.mini{display:flex;align-items:center;gap:10px;padding:8px 10px 12px 8px;border-radius:22px;position:relative;overflow:hidden;cursor:pointer}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.mp{position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--track)}
.mp i{display:block;height:100%;width:0;background:var(--fg);border-radius:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:26px;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center}
.tab.on{background:linear-gradient(135deg,var(--glass-a),var(--glass-b));color:var(--accent);box-shadow:inset 0 1px 0 var(--glass-hi)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:176px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:40;max-width:92%;text-align:center}

.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:var(--sheet);-webkit-backdrop-filter:blur(48px) saturate(180%);backdrop-filter:blur(48px) saturate(180%);transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s .42s}
.sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-top .mid{text-align:center;min-width:0}
.sh-top .mid p:last-child{margin:2px 0 0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-art{margin:auto;width:clamp(190px,calc(100dvh - 440px),100%);aspect-ratio:1;border-radius:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);transform:scale(.86);transition:transform .5s cubic-bezier(.32,.72,0,1)}
.playing .sh-art{transform:scale(1)}
.sh-art .cv{border-radius:28px}
.sh-meta h2{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-meta p{margin:4px 0 0;color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:28px;margin:0;--p:0%}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(to right,var(--fg) var(--p),var(--track) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-4px;box-shadow:0 2px 6px var(--shadow)}
.seek::-moz-range-track{height:6px;border-radius:6px;background:var(--track)}
.seek::-moz-range-progress{height:6px;border-radius:6px;background:var(--fg)}
.seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.ctl .ib{width:52px;height:52px;position:relative;color:var(--muted)}
.ctl .ib .i{width:26px;height:26px}
.ctl .ib.sk{color:var(--fg)}
.ctl .ib.sk .i{width:30px;height:30px}
.ctl .ib.on{color:var(--accent)}
.ctl .ib.on::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.ctl .ib .one{position:absolute;font-size:10px;font-weight:700;top:12px;right:12px}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 14px 30px -10px var(--shadow)}
.playbtn .i{width:32px;height:32px}
.sh-next{margin:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.scanm{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:20px 16px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sm{width:100%;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,var(--glass-a),var(--glass-b)),var(--bg)}
.sm p{margin:0;color:var(--muted);font-size:14px}
.sm .btn{flex:none;width:100%}
.sm label.btn{cursor:pointer}
.pbar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .2s}
.sm .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--faint)}

.fl{max-height:42dvh;overflow-y:auto;border-radius:18px}
.fr{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
.fr+.fr{border-top:1px solid var(--hair)}
.fr input{width:22px;height:22px;accent-color:var(--accent);flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

</defs></svg>

<div class="amb"></div>
<div id="app">
  <main id="views" tabindex="-1"></main>

  <div class="dock">
    <div id="mini" class="mini glass" data-act="sheet-open" hidden></div>
    <nav class="tabs glass" aria-label="Secciones">
      <button class="tab" data-act="tab" data-tab="home"><svg class="i"><use href="#i-home"/></svg>Inicio</button>
      <button class="tab" data-act="tab" data-tab="folders"><svg class="i"><use href="#i-folder"/></svg>Carpetas</button>
      <button class="tab" data-act="tab" data-tab="songs"><svg class="i"><use href="#i-music"/></svg>Música</button>
      <button class="tab" data-act="tab" data-tab="top"><svg class="i"><use href="#i-chart"/></svg>Escuchadas</button>
    </nav>
  </div>

  <div id="toast" class="toast glass" role="status" hidden></div>

  <section id="sheet" class="sheet" aria-label="Reproduciendo ahora" inert>
    <div class="sh-top">
      <button class="glass round" data-act="sheet-close" aria-label="Cerrar reproductor"><svg class="i"><use href="#i-down"/></svg></button>
